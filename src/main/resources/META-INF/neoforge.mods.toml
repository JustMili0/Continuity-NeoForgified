modLoader="javafml"
loaderVersion="[0,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "${mod_description}"
authors = "${mod_authors}"
logoFile = "assets/continuity/banner_hd.png"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_constraint}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "fabric_api"
type = "required"
versionRange = "[${forgified_fabric_api},)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "${mod_id}.mixins.json"

[modproperties.${mod_id}]
"sodium:config_api_user" = "me.pepperbell.continuity.client.config.SodiumConfigImpl"